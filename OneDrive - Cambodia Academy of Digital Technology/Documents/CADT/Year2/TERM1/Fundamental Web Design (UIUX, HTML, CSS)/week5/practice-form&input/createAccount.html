<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CreateAccount</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="head">Create Account</div>

            <div class="middle">
                <div class="name">
                    <label>
                        First name*<br>
                        <input type="text" placeholder="enter your first name">
                    </label>
                    <label>
                        Last name*<br>
                        <input type="text" placeholder="enter your last name">
                    </label>
                </div>

                <label class="email">Email*<br>
                    <input type="email" placeholder="enter your email">
                </label>

                <div class="password">
                    <label>
                        Password*<br>
                        <input type="text" placeholder="enter your password">
                    </label>
                    <label>
                        Comfirm Password*<br>
                        <input type="text" placeholder="enter your passwrod">
                    </label>
                </div>

                <div class="gender">
                    <label>
                        Gender<br>
                        <input type="radio" value="male">
                        <label>Male</label>
                        <input type="radio" value="female">
                        <label>Female</label>
                    </label>
                    <label>
                        Hobby<br>
                        <input type="checkbox">
                        <label>Music</label>
                        <input type="checkbox">
                        <label>Sports</label>
                        <input type="checkbox">
                        <label>Movies</label>
                    </label>
                </div>

                <div class="source">
                    <label>
                        Source of icome<br>
                        <select>
                            <option>Employee</option>
                            <option>BOSS</option>
                            <option>CEO</option>
                            <option>Manager</option>
                        </select>
                    </label>
                    <label>
                        Income<br>
                        <input type="range" min="0" max="1000">
                    </label>
                </div>

                <div class="file">
                    <label>
                        Upload Profile Picture<br>
                        <input type="file">
                    </label>
                    <label>
                        Age<br>
                        <input type="text" placeholder="enter your age">
                    </label>
                </div>
                <div class="bio">
                    <label>
                        Bio<br>
                        <textarea rows="4"
                        placeholder="Write something..."></textarea>
                    </label>
                </div>
            </div>
            <div class="footer">
                <button>Create</button>
            </div>
        </div>
        
    </body>
</html>
